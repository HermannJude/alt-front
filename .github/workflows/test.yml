name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "feature/**"
      - "fix/**"
jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm build

      # - name: Run tests
      #  run: pnpm test
